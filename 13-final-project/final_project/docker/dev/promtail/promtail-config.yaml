server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: base-consumer
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            correlation_id: correlation_id
            correlationId: correlationId
            traceId: traceId
            request_id: request_id
            trace_id: traceId
      - labels:
          severity:
    static_configs:
      - targets:
          - localhost
        labels:
          job: base-consumer
          app: base-consumer
          component: consumer
          env: local
          __path__: /app/logs/consumer.log
  - job_name: base-api
    pipeline_stages:
      - json:
          expressions:
            severity: severity
            correlation_id: correlation_id
            correlationId: correlationId
            traceId: traceId
            request_id: request_id
            trace_id: traceId
      - labels:
          severity:
    static_configs:
      - targets:
          - localhost
        labels:
          job: base-api
          app: base-api
          component: api
          env: local
          __path__: /app/logs/api.log