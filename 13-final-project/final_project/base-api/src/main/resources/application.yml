debug: false
server:
  port: '${SERVER_PORT:8080}'
  shutdown: graceful
  http2:
    enabled: '${SERVER_HTTP2_ENABLED:true}'
  tomcat:
    max-connections: '${TOMCAT_MAX_CONNECTIONS:10000}'
    accept-count: '${TOMCAT_ACCEPT_COUNT:500}'
    connection-timeout: '${TOMCAT_CONNECTION_TIMEOUT:15s}'
    keep-alive-timeout: '${TOMCAT_KEEP_ALIVE_TIMEOUT:10s}'

spring:
  application:
    name: base-api
  profiles:
    active: '${SPRING_PROFILES_ACTIVE:local}'
  lifecycle:
    timeout-per-shutdown-phase: '${LIFECYCLE_TIMEOUT_SHUTDOWN:15s}'
  threads:
    virtual:
      enabled: true
  mvc:
    async:
      request-timeout: '${MVC_ASYNC_TIMEOUT:30s}'
  data:
    redis:
      timeout: '${VALKEY_TIMEOUT:2000ms}'
      url: '${VALKEY_URL}'
      host: '${VALKEY_HOST}'
      port: '${VALKEY_PORT}'
      lettuce:
        pool:
          max-active: '${VALKEY_POOL_MAX_ACTIVE:64}'
          max-idle: '${VALKEY_POOL_MAX_IDLE:32}'
          min-idle: '${VALKEY_POOL_MIN_IDLE:8}'
          max-wait: '${VALKEY_POOL_MAX_WAIT:2000ms}'

app:
  api-key: '${APP_API_KEY:}'

  executor:
    async-core-size: 16
    async-max-size: 64
    async-queue-capacity: 1000
    async-await-termination-seconds: 30

  redis:
    event-ttl: 600

  load-test-metrics:
    enabled: '${APP_LOAD_METRICS_ENABLED:false}'

aws:
  region: '${AWS_REGION:sa-east-1}'
  accessKeyId: '${AWS_ACCESS_KEY_ID:}'
  secretKey: '${AWS_SECRET_KEY:}'
  localstack-endpoint: '${AWS_LOCALSTACK_ENDPOINT:}'
  sdk:
    http:
      max-connections: '${AWS_SDK_HTTP_MAX_CONNECTIONS:100}'
      connection-timeout-ms: '${AWS_SDK_HTTP_CONNECTION_TIMEOUT_MS:5000}'
      socket-timeout-ms: '${AWS_SDK_HTTP_SOCKET_TIMEOUT_MS:10000}'
      connection-acquisition-timeout-ms: '${AWS_SDK_HTTP_CONN_ACQUISITION_TIMEOUT_MS:10000}'
    retry:
      max-attempts: '${AWS_SDK_RETRY_MAX_ATTEMPTS:3}'
    api-call:
      attempt-timeout-ms: '${AWS_SDK_API_ATTEMPT_TIMEOUT_MS:10000}'
      timeout-ms: '${AWS_SDK_API_CALL_TIMEOUT_MS:35000}'
  sqs:
    queues:
      input-queue: '${AWS_SQS_QUEUES_INPUT_QUEUE_URL}'

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: '${MANAGEMENT_TRACING_ENABLED:true}'
    sampling:
      probability: '${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}'
    export:
      enabled: '${MANAGEMENT_TRACING_EXPORT_ENABLED:true}'
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: '${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}'
          transport: http
  otlp:
    metrics:
      export:
        enabled: false